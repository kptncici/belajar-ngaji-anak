<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;

  /* 🔥 BACKGROUND GAMBAR (SAMA KAYAK LOGIN) */
  background: 
    linear-gradient(rgba(30, 90, 40, 0.75), rgba(30, 90, 40, 0.75)),
    url('./img/bg-masjid.jpg');

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  height: 100vh;
}

/* 🔥 WRAPPER CENTER */
.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}

/* CONTAINER */
.container {
  width: 900px;
  max-width: 95%;
  height: 520px;
  background: #1b5e20;
  border-radius: 20px;
  display: flex;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

/* LEFT */
.left {
  width: 50%;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.left img {
  width: 200px;
  margin-bottom: 20px;
}

.left h3 {
  color: #2e7d32;
}

.left p {
  text-align: center;
}

/* RIGHT */
.right {
  width: 50%;
  padding: 40px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.right h2 {
  margin-bottom: 20px;
}

.input {
  margin-bottom: 15px;
}

.input input {
  width: 100%;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  outline: none;
}

.btn {
  padding: 12px;
  border-radius: 20px;
  border: none;
  background: #66bb6a;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

.btn:hover {
  background: #4caf50;
}

.link {
  margin-top: 15px;
  font-size: 14px;
}

.link a {
  color: #a5d6a7;
  text-decoration: none;
}

/* 🔥 RESPONSIVE */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    height: auto;
  }

  .left, .right {
    width: 100%;
    padding: 20px;
  }

  .left img {
    width: 120px;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="container">

    <!-- LEFT -->
    <div class="left">
      <img src="./img/logo-anak.png">
      <h3>Belajar Ngaji</h3>
      <p>Daftar dan mulai belajar membaca Al-Qur'an dengan mudah</p>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <h2>Register</h2>

      <div class="input">
        <input id="email" type="email" placeholder="Email">
      </div>

      <div class="input">
        <input id="password" type="password" placeholder="Password">
      </div>

      <div class="input">
        <input id="confirm" type="password" placeholder="Konfirmasi Password">
      </div>

      <button class="btn" onclick="register()">Daftar</button>

      <div class="link">
        Sudah punya akun? <a href="login.html">Login</a>
      </div>
    </div>

  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCs7f8OxIoGeRdbHdgzygPzd-XHqbwvyIw",
  authDomain: "belajar-ngaji-4d8a6.firebaseapp.com",
  projectId: "belajar-ngaji-4d8a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if(pass !== confirm){
    alert("Password tidak sama!");
    return;
  }

  if(pass.length < 6){
    alert("Password minimal 6 karakter");
    return;
  }

  createUserWithEmailAndPassword(auth, email, pass)
    .then(() => {
      alert("Berhasil daftar!");
      window.location.href = "login.html";
    })
    .catch(err => alert(err.message));
}
</script>

</body>
</html>
