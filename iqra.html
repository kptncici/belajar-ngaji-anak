  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }

    /* CARD LEVEL */
    .iqra-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      transition: 0.3s;
    }

    .iqra-card:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .iqra-left {
      display: flex;
      align-items: center;
    }

    .iqra-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-right: 15px;
    }

    /* GRID LATIHAN */
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .iqra-item {
  font-size: 48px;
  padding: 25px 10px;
  background: #f5f5f5; /* putih elegan */
  color: #d4a94f; /* warna emas huruf */
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.iqra-item:hover {
  transform: scale(1.05);
  background: #ffffff;
}

/* saat dimainkan */
.playing {
  background: linear-gradient(145deg, #4CAF50, #2e7d32) !important;
  color: white !important;
}

.banner-text {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 20px;

  background: rgba(255, 255, 255, 0.2); /* transparan putih */
  backdrop-filter: blur(10px); /* efek blur kaca */
  -webkit-backdrop-filter: blur(10px);

  color: white;
  font-size: 18px;
  margin-top: 10px;

  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.level-badge{

  display:block;
  width:fit-content;
  margin:15px auto 0;
  display:inline-block;
  margin-top:18px;
  padding:12px 28px;

  background:rgba(19, 87, 4, 0.9);
  backdrop-filter:blur(10px);

  color:white;
  border-radius:40px;

  font-size:18px;
  font-weight:700;
  letter-spacing:1px;

  box-shadow:0 8px 25px rgba(0,0,0,0.3);

  border:1px solid rgba(255,255,255,0.15);
}

<audio id="audio"></audio>

const audio = document.getElementById("audio");

function playSequence(list, el) {
  let i = 0;
  el.classList.add("playing");

  function next() {
    if (i >= list.length) {
      el.classList.remove("playing");
      return;
    }

    audio.src = "audio/hijaiyah/" + list[i];
    audio.play();

    audio.onended = () => {
      i++;
      next();
    };
  }

  next();
}

function openLevel(level) {
  document.querySelector(".banner-text").innerHTML =
  "Belajar membaca dari dasar";
  const oldBadge = document.querySelector(".level-badge");

if(oldBadge){
  oldBadge.remove();
}

const badge = document.createElement("h6");

badge.className = "level-badge";
badge.innerText = "Level " + level;

document.querySelector(".banner-text")
  .parentNode
  .appendChild(badge);
  menu.style.display = "none";
  latihan.style.display = "block";

  list.innerHTML = "";

  levels[level].forEach(item => {
    let div = document.createElement("div");
    div.className = "iqra-item";
    div.innerText = item.text;

    div.onclick = () => playSequence(item.sounds, div);

    list.appendChild(div);
  });
}

function backMenu() {

  const badge = document.querySelector(".level-badge");

  if(badge){
    badge.remove();
  }

  menu.style.display = "block";
  latihan.style.display = "none";
}
